<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Engine Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .blocked {
            color: #dc3545; /* Червоний для заблокованих */
            font-weight: bold;
        }
        .not-blocked {
            color: #28a745; /* Зелений для розблокованих */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Заголовок -->
        <h1 class="my-4 text-center">Response Engine Dashboard</h1>

        <!-- Таблиця -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>IP</th>
                        <th>Status</th>
                        <th>Blocked At</th>
                        <th>Unblock After</th>
                        <th>Block Count</th>
                        <th>Trigger Count</th>
                        <th>Last Event Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .}}
                    <tr>
                        <td>{{.ID}}</td>
                        <td>{{.IP}}</td>
                        <td class="{{if eq .Status "Blocked"}}blocked{{else}}not-blocked{{end}}">{{.Status}}</td>
                        <td>{{.BlockedAt}}</td>
                        <td>{{.UnblockAfter}}</td>
                        <td>{{.BlockCount}}</td>
                        <td>{{.TriggerCount}}</td>
                        <td>{{.LastEventTime}}</td>
                        <td>
                            {{if eq .Status "Blocked"}}
                            <form method="POST" action="/unblock">
                                <input type="hidden" name="ip" value="{{.IP}}">
                                <button type="submit" class="btn btn-danger btn-sm">Unblock</button>
                            </form>
                            {{end}}
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
